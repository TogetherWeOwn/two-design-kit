<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
<!-- Mobile 390x844 (kit review width). Partial notice and error state with the action row. -->
<rect x="0" y="0" width="390" height="844"/>
<text x="24" y="40" font-size="20" stroke="none" fill="#000">Recovery actions — 390</text>
<rect x="24" y="64" width="344" height="136" rx="8"/>
<text x="40" y="96" font-size="14" stroke="none" fill="#000">Some Discord events may be missing</text>
<text x="40" y="116" font-size="14" stroke="none" fill="#000">from this schedule right now.</text>
<text x="40" y="160" font-size="14" stroke="none" fill="#000">Retry</text>
<line x1="40" y1="166" x2="80" y2="166"/>
<text x="104" y="160" font-size="14" stroke="none" fill="#000">Join the Discord</text>
<line x1="104" y1="166" x2="216" y2="166"/>
<g stroke="#d33" stroke-dasharray="4 4" fill="none"><rect x="32" y="136" width="200" height="40"/></g><circle cx="232" cy="136" r="10" fill="#d33" stroke="none"/><text x="232" y="140" font-size="12" text-anchor="middle" stroke="none" fill="#fff">1</text>
<rect x="24" y="224" width="344" height="152" rx="8" fill="#e6e6e6"/>
<text x="40" y="256" font-size="14" stroke="none" fill="#666">Healthy rows stay visible below the notice</text>
<rect x="24" y="400" width="344" height="184" rx="8"/>
<text x="40" y="440" font-size="20" stroke="none" fill="#000">We couldn&#8217;t load the calendar.</text>
<text x="40" y="472" font-size="14" stroke="none" fill="#666">The Discord always has the latest —</text>
<text x="40" y="536" font-size="14" stroke="none" fill="#000">Retry</text>
<line x1="40" y1="542" x2="80" y2="542"/>
<text x="104" y="536" font-size="14" stroke="none" fill="#000">Join the Discord</text>
<line x1="104" y1="542" x2="216" y2="542"/>
<g stroke="#d33" stroke-dasharray="4 4" fill="none"><rect x="32" y="512" width="200" height="40"/></g><circle cx="232" cy="512" r="10" fill="#d33" stroke="none"/><text x="232" y="516" font-size="12" text-anchor="middle" stroke="none" fill="#fff">2</text>
<text x="24" y="632" font-size="12" stroke="none" fill="#d33">1 — row fits on one line at 390; wraps at 320 with</text>
<text x="24" y="652" font-size="12" stroke="none" fill="#d33">    a 12px row gap, Retry stays first</text>
<text x="24" y="680" font-size="12" stroke="none" fill="#d33">2 — role=alert container unchanged; only the action</text>
<text x="24" y="700" font-size="12" stroke="none" fill="#d33">    paragraph becomes the row</text>
</svg>
