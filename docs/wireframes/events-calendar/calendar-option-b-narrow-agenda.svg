<g stroke="#d33" stroke-dasharray="4 4" fill="none"><rect x="16" y="176" width="360" height="392"/></g><circle cx="376" cy="176" r="10" fill="#d33" stroke="none"/><text x="376" y="180" font-size="12" text-anchor="middle" stroke="none" fill="#fff">1</text>
<text x="24" y="592" font-size="12" stroke="none" fill="#d33">1 — every day visible, but it duplicates the list view,</text>
<text x="24" y="608" font-size="12" stroke="none" fill="#d33">    drops the month shape, needs display:block on table</text>
<text x="24" y="624" font-size="12" stroke="none" fill="#d33">    parts (Safari loses table semantics) and makes the</text>
<text x="24" y="640" font-size="12" stroke="none" fill="#d33">    scroll hint untrue</text>
