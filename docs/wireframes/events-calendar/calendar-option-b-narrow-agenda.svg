<rect x="24" y="352" width="344" height="72"/>
<text x="40" y="376" font-size="14" stroke="none" fill="#000">Mon 15</text>
<text x="120" y="376" font-size="14" stroke="none" fill="#000">18:00 UTC Game night</text>
<rect x="120" y="388" width="112" height="24"/>
