<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
<!-- Mobile 390x844. Option B (REJECTED): reflow the month table into a stacked agenda under the compact breakpoint. -->
<rect x="0" y="0" width="390" height="844"/>
<text x="24" y="40" font-size="20" stroke="none" fill="#000">Option B — agenda (rejected)</text>
<rect x="24" y="64" width="48" height="40"/>
