<text x="136" y="89" font-size="14" stroke="none" fill="#000" text-anchor="middle">June 2026</text>
<rect x="200" y="64" width="48" height="40"/>
<text x="224" y="89" font-size="14" stroke="none" fill="#000" text-anchor="middle">→</text>
<rect x="264" y="64" width="104" height="40"/>
<text x="316" y="89" font-size="14" stroke="none" fill="#000" text-anchor="middle">This month</text>
