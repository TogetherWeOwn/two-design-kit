# CI for two-design-kit (from the org starter-ci template).
#
# The token pipeline (validate -> build -> drift -> contrast -> ts/rust/test)
# runs when token areas change; lint always runs. The required checks are
# `ci-ok` (this file), `gitleaks` (gitleaks.yml), `pr-lint` (pr-lint.yml)
# and Devin Review. Never add workflow-level `on: pull_request: paths:`
# here: it would suppress the required `ci-ok` check.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group: {}
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly full run (safety net)
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    uses: TogetherWeOwn/.github/.github/workflows/changes.yml@773ee91a904b9e1b65eddaaad4400d36e05fa717
    with:
      areas-json: '{"tokens":["tokens/**","scripts/**","social/**","sd.config.mjs","package.json","package-lock.json","tsconfig.check.json","test/**"],"docs":["**.md","docs/**"]}'
      full-run-globs-json: '["package.json","**/package.json","package-lock.json","**/package-lock.json","npm-shrinkwrap.json","**/npm-shrinkwrap.json","pnpm-lock.yaml","**/pnpm-lock.yaml","yarn.lock","**/yarn.lock","Gemfile","**/Gemfile","Gemfile.lock","**/Gemfile.lock","Cargo.toml","**/Cargo.toml","Cargo.lock","**/Cargo.lock","go.mod","**/go.mod","go.sum","**/go.sum","pyproject.toml","**/pyproject.toml","poetry.lock","**/poetry.lock","uv.lock","**/uv.lock","requirements*.txt","**/requirements*.txt","requirements*.in","**/requirements*.in","setup.py","**/setup.py","setup.cfg","**/setup.cfg","Pipfile","**/Pipfile","Pipfile.lock","**/Pipfile.lock","composer.json","**/composer.json","composer.lock","**/composer.lock","pnpm-workspace.yaml","**/pnpm-workspace.yaml","go.work","**/go.work","go.work.sum","**/go.work.sum","tsconfig*.json","**/tsconfig*.json","jsconfig*.json","**/jsconfig*.json",".cargo/**","**/.cargo/**","rust-toolchain*","**/rust-toolchain*",".npmrc","**/.npmrc",".yarnrc*","**/.yarnrc*","Makefile*","**/Makefile*","CMakeLists.txt","**/CMakeLists.txt",".github/**","shared/**","common/**","build/**","Dockerfile*","**/Dockerfile*","docker-compose*.yml","**/docker-compose*.yml"]'
      docs-areas-json: '["docs"]'

  full_run:
    name: full run context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      force: ${{ steps.ctx.outputs.force }}
    steps:
      - id: ctx
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      # Tier 0 (CI-STANDARD rule 21): workflow lint, checksum-pinned.
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  build:
    name: build
    needs: [changes, full_run]
    if: needs.full_run.outputs.force == 'true' || needs.changes.outputs.full_run == 'true' || (fromJSON(needs.changes.outputs.areas).tokens && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run validate
      - run: npm run build
      - run: npm run drift
      - run: npm run contrast
      - run: npm run check:ts
      - name: Check generated Rust compiles
        run: rustc --edition=2021 --crate-type=lib dist/rust/brand_tokens.rs -o "$RUNNER_TEMP/brand_tokens.rlib"
      - run: npm test

  ci-ok:
    name: ci-ok
    needs: [changes, full_run, lint, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 -I - "$NEEDS_JSON" <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if v.get("result") not in ("success", "skipped")}
          if bad:
              print(f"failing jobs: {bad}")
              sys.exit(1)
          print("ci-ok: every needed job succeeded or was skipped")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
