# Risk-tiered review map for TogetherWeOwn/two-design-kit.
#
# Classification: a PR's tier is the highest tier of any changed file;
# sensitive always wins on overlap; anything unmatched is sensitive
# (default_tier). Every new top-level path is unclassified (= sensitive)
# until added to a named tier here.
#
# Content triggers escalate to sensitive regardless of path tier:
# new/changed public endpoint or input parsing; auth/authz/session;
# crypto/keys; secrets/credentials; permission checks; tenant
# isolation/personal data; SQL/schema/migrations; dependency or
# lockfile changes; CI/workflow changes; weakened test assertions,
# deleted tests/snapshots or lowered gates in test files.
#
# Review per tier: low -> QA; ordinary -> QA; sensitive/unclassified
# -> Security -> QA. QA verifies the author's risk_tier attestation
# against this map and the diff, and may escalate any PR. This file
# itself is always sensitive.
version: 1
default_tier: sensitive
tiers:
  low:
    # Allowlisted docs copy: design-spec markdown and the repo README.
    - docs/*.md
    - README.md
    # Static non-sensitive fixtures: generated mockup PNGs.
    - mockups/png/**
    # Additive unit tests only; content triggers still apply
    # (weakened assertions, deleted tests/snapshots or lowered gates
    # in test files escalate to sensitive regardless of this entry).
    - test/**
  ordinary: []
    # No audited ordinary modules yet. Anything with untrusted input,
    # sensitive output, permissions, persistence or a trust-boundary
    # effect stays unlisted (= sensitive) until consciously added with
    # a justification in the PR that classifies it.
  sensitive:
    # Review policy and CI: always sensitive.
    - .github/workflows/**
    - .github/review-tiers.yml
    - .github/**
    - CODEOWNERS
    - .github/CODEOWNERS
    # Dependency manifests, lockfiles and install/build scripts.
    - package.json
    - package-lock.json
    - .npmrc
    - sd.config.mjs
    # Tooling and repo configuration.
    - biome.json
    - tsconfig.check.json
    - .gitleaks.toml
    - .gitignore
    - .gitattributes
    # Governance, agent and skill/tool-permission files.
    - AGENTS.md
    - CONTRIBUTING.md
    - .claude/**
    # Build and validation scripts (they execute code).
    - scripts/**
    # Token sources and built artifacts: the published design system.
    # Changes propagate to downstream consumers, so never ordinary.
    - tokens/**
    - dist/**
